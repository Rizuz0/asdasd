.full,.game{display:none;position:absolute;top:0;left:0;right:0;bottom:0}
body[data-s=game] .game{display:block}
body:not([data-s=game]) .full{display:block}
canvas{position:absolute}
.scan{position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(#0000 0 3px,#0003 3px 4px);animation:fl .15s steps(2) infinite}
@keyframes fl{50%{opacity:.75}}
.k{position:absolute;width:64px;height:64px;border:0 solid var(--c)}
.k.a{left:40px;top:40px;border-width:8px 0 0 8px}.k.b{right:40px;top:40px;border-width:8px 8px 0 0}
.k.c{left:40px;bottom:40px;border-width:0 0 8px 8px}.k.d{right:40px;bottom:40px;border-width:0 8px 8px 0}
.mid{position:absolute;left:0;right:0;top:250px;text-align:center}
.tagb{display:inline-block;padding:18px 44px;border:4px solid var(--c);box-shadow:0 0 0 4px var(--d),0 0 26px #25f4ee88;color:var(--p);font-size:26px;letter-spacing:6px;background:#07030fcc;animation:bl 1.2s steps(2) infinite}
@keyframes bl{50%{opacity:.55}}
h1{font-weight:400;font-size:104px;margin-top:34px;color:#ffeaff;text-shadow:2px 2px 0 var(--p),4px 4px 0 var(--p),6px 6px 0 #c4223f,8px 8px 0 #c4223f,10px 10px 0 #7c1228,0 0 40px #fe2c55cc,0 0 100px #8b2cff;animation:gl 5s steps(1) infinite}
@keyframes gl{92%{transform:translate(-12px,4px)}94%{transform:translate(12px,-4px)}96%{transform:none}}
.tm{font-size:56px;color:var(--y);text-shadow:5px 5px 0 #b36b00,0 0 30px #ffe14d88;margin-top:36px}
.bar{display:flex;justify-content:center;gap:8px;margin-top:24px}
.bar i{width:26px;height:26px;background:#ffffff18}.bar i.on{background:var(--c);box-shadow:0 0 14px var(--c)}
.sub{margin-top:26px;font-size:22px;color:#e9d6ff;height:30px;white-space:nowrap}
.chips{position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center;gap:100px}
.chip{display:flex;align-items:center;gap:18px;padding:14px 24px;background:#0b0618;border:4px solid #ffffff30;border-top-color:var(--c);font-size:20px;box-shadow:6px 6px 0 #0007}
/* juego */
.live{position:absolute;left:60px;top:48px;background:var(--p);padding:16px 26px;font-size:24px;box-shadow:6px 6px 0 #6e0f22}
.live b{display:inline-block;width:16px;height:16px;background:#fff;margin-right:14px;animation:bl .8s steps(2) infinite}
.top{position:absolute;right:60px;top:48px}
.cam{position:absolute;left:60px;bottom:190px;width:480px;height:270px;border:6px solid var(--c);box-shadow:0 0 0 6px #07030fcc,0 0 30px #25f4ee88;animation:cc 6s steps(1) infinite}
@keyframes cc{0%{border-color:var(--c)}25%{border-color:var(--p)}50%{border-color:var(--y)}75%{border-color:var(--v)}}
.ct{position:absolute;top:-48px;left:-6px;background:var(--c);color:var(--d);font-size:18px;padding:11px 16px}
#ps{left:60px;bottom:134px}
.gb{position:absolute;left:60px;right:60px;bottom:40px;height:84px;background:#0a0418ee;border:4px solid var(--c);box-shadow:0 0 0 4px #07030fcc;display:flex;align-items:center;padding:0 32px;gap:34px;font-size:24px}
.gb .p1{color:var(--p)}.gb .msg{flex:1;white-space:nowrap}.gb .ck{color:var(--y)}
</style></head><body data-s="game">
<div class="full"><canvas id="cv" width="1920" height="1080"></canvas>
<div class="mid"><div class="tagb" id="tag"></div><h1 id="ti"></h1><div class="tm" id="tm">00:00</div><div class="bar" id="bar"></div><div class="sub" id="sub"></div></div>
<div class="chips" id="chips"></div>
<div class="k a"></div><div class="k b"></div><div class="k c"></div><div class="k d"></div><div class="scan"></div></div>
<div class="game"><div class="k a"></div><div class="k b"></div><div class="k c"></div><div class="k d"></div>
<div class="live"><b></b>EN VIVO</div><div class="top" id="top"></div>
<div class="cam"><div class="ct">CAM · P1</div></div>
<canvas id="ps" width="1800" height="28"></canvas>
<div class="gb"><span class="p1" id="gn"></span><span class="msg" id="gm"></span><span class="ck" id="ck"></span></div></div>
<script>
// ====== CONFIGURA AQUÍ ======
const CFG={
 nombre:"Rizuz",
 tt:"@Rizuz0", ig:"andr3sru1z_", yt:"@Rizuz0",
 redes:["tt","ig","yt"], // orden en que salen; quita las que no uses

 tagInicio:"PREPARANDO EL DIRECTO", tituloInicio:"INICIANDO",
 tagPausa:"VUELVO EN UN MOMENTO", tituloPausa:"PAUSA",
 minInicio:5, minPausa:5,
 frasesInicio:["Insert coin para empezar...","Ve acomodándote en el chat","Dale follow para no perderte nada"],
 frasesPausa:["Recargando vidas...","Cuéntame en el chat cómo vas","No te vayas, ya vuelvo"],
 frasesJuego:["Sígueme para no perderte nada","Comenta en el chat, te leo","Comparte el live y manda tus rosas"]
};
// ============================
// TikTok LIVE Studio a veces carga el origen con tamaño 0: se usa 1920x1080 de respaldo y se reajusta solo
const fit=()=>{document.body.style.transform='scale('+Math.min((innerWidth||1920)/1920,(innerHeight||1080)/1080)+')'};fit();addEventListener('resize',fit);setInterval(fit,2000);
const S=document.body.dataset.s,$=i=>document.getElementById(i),P=n=>String(n).padStart(2,'0');
const IG='<svg width="40" height="40" viewBox="0 0 32 32" shape-rendering="crispEdges"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fdc468"/><stop offset=".5" stop-color="#e1306c"/><stop offset="1" stop-color="#833ab4"/></linearGradient></defs><rect width="32" height="32" fill="url(#g)"/><rect x="7" y="7" width="18" height="18" fill="none" stroke="#fff" stroke-width="3"/><rect x="13" y="13" width="6" height="6" fill="#fff"/></svg>';
const YT='<svg width="48" height="40" viewBox="0 0 38 32" shape-rendering="crispEdges"><rect y="4" width="38" height="24" fill="#ff1f3d"/><path d="M15 10v12l10-6z" fill="#fff"/></svg>';
const CI=`<div class="chip">${IG}${CFG.ig}</div>`,CY=`<div class="chip">${YT}${CFG.yt}</div>`,
TT='<svg width="40" height="40" viewBox="0 0 32 32" shape-rendering="crispEdges"><rect width="32" height="32" fill="#000"/><g fill="#25f4ee" transform="translate(-1.5,-1.5)"><rect x="16" y="6" width="4" height="15"/><rect x="20" y="6" width="3" height="3"/><rect x="23" y="9" width="3" height="3"/><rect x="10" y="17" width="7" height="7"/></g><g fill="#fe2c55" transform="translate(1.5,1.5)"><rect x="16" y="6" width="4" height="15"/><rect x="20" y="6" width="3" height="3"/><rect x="23" y="9" width="3" height="3"/><rect x="10" y="17" width="7" height="7"/></g><g fill="#fff"><rect x="16" y="6" width="4" height="15"/><rect x="20" y="6" width="3" height="3"/><rect x="23" y="9" width="3" height="3"/><rect x="10" y="17" width="7" height="7"/></g></svg>',CT=`<div class="chip">${TT}${CFG.tt}</div>`,RS=CFG.redes.map(k=>({tt:CT,ig:CI,yt:CY})[k]);
const SP=["....XXXX....","..XXXXXXXX..",".XXXXXXXXXX.",".XWWXXXXWWX.",".XWBXXXXWBX.","XXXXXXXXXXXX","XXXXXXXXXXXX","XXXXXXXXXXXX","XXXXXXXXXXXX","XXXXXXXXXXXX"],F=["XXX.XXXX.XXX","XX.XXXXXX.XX"];
function spr(x,cx,cy,px,f,col){SP.concat(F[f]).forEach((r,j)=>[...r].forEach((c,i)=>{if(c=='.')return;x.fillStyle=c=='W'?'#fff':c=='B'?'#2b5bff':col;x.fillRect(cx+i*px,cy+j*px,px,px)}))}
function ty(el,arr,gap){let k=0;(function n(){const s=arr[k++%arr.length];let i=0;el.textContent='';const iv=setInterval(()=>{el.textContent=s.slice(0,++i);if(i>=s.length){clearInterval(iv);setTimeout(n,gap)}},45)})()}
if(S!=='game'){
 const st=S==='start';
 $('tag').textContent=st?CFG.tagInicio:CFG.tagPausa;$('ti').textContent=st?CFG.tituloInicio:CFG.tituloPausa;
 $('chips').innerHTML=RS.join('');ty($('sub'),st?CFG.frasesInicio:CFG.frasesPausa,3000);
 const bar=$('bar');for(let i=0;i<24;i++)bar.appendChild(document.createElement('i'));
 const tot=(st?CFG.minInicio:CFG.minPausa)*60000,end=Date.now()+tot;
 setInterval(()=>{const l=Math.max(0,end-Date.now()),s=Math.ceil(l/1000),n=Math.round(24*(1-l/tot));
  $('tm').textContent=P(Math.floor(s/60))+':'+P(s%60);[...bar.children].forEach((b,i)=>b.className=i<n?'on':'')},250);
 const x=$('cv').getContext('2d'),R=Math.random,pick=a=>a[R()*a.length|0];
 const side=()=>R()<.5?R()*470:1450+R()*470;
 const stars=Array.from({length:80},()=>({x:R()*480|0,y:R()*170|0,p:R()*9})),
 cf=Array.from({length:16},()=>({x:side(),y:R()*1080,s:pick([8,12,16]),c:pick(['#ffe14d','#25f4ee','#fe2c55','#b86bff']),v:R()*.4+.1,p:R()*9}));
 const K=st?1:1.5;
 (function f(t){x.clearRect(0,0,1920,1080);x.fillStyle='#fff';
  for(const s of stars){x.globalAlpha=Math.sin(t/600+s.p)>.3?1:.25;x.fillRect(s.x*4,s.y*4,4,4)}
  for(let L=0;L<2;L++){x.globalAlpha=1;x.fillStyle=L?'#4a0e7a':'#260845';
   for(let i=0;i<120;i++){let h=(L?130:220)+Math.sin(i*.3+t/(L?1100:1800))*40+Math.abs(Math.sin(t/260+i*.6+L*2))*34*K;h=Math.round(h/16)*16;x.fillRect(i*16,1080-h,16,h)}}
  for(const c of cf){c.y-=c.v;c.x+=Math.sin(t/1200+c.p)*.4;if(c.y<-20){c.y=1100;c.x=side()}
   x.globalAlpha=Math.sin(t/400+c.p)>-.4?1:.2;x.fillStyle=c.c;x.fillRect(Math.round(c.x/4)*4,Math.round(c.y/4)*4,c.s,c.s)}
  x.globalAlpha=1;x.shadowColor='#25f4ee';x.shadowBlur=30;
  spr(x,900,80+Math.round(Math.sin(t/500)*2)*8,10,Math.floor(t/400)%2,'#7df0ff');x.shadowBlur=0;
  requestAnimationFrame(f)})(0);
}else{
 $('gn').textContent='P1 · '+CFG.nombre;ty($('gm'),CFG.frasesJuego,4000);
 let a=0;const sw=()=>{$('top').innerHTML=RS[a++%RS.length]};sw();setInterval(sw,6000);
 setInterval(()=>{const d=new Date();$('ck').textContent=P(d.getHours())+':'+P(d.getMinutes())},1000);
 const p=$('ps').getContext('2d');let gx=0;
 (function f(t){p.clearRect(0,0,1800,28);gx=(gx+2)%1900;
  for(let X=40;X<1800;X+=40)if(X>gx){p.fillStyle='#ffe14d';p.fillRect(X,11,6,6)}
  spr(p,gx-24,3,2,Math.floor(t/150)%2,'#fe2c55');requestAnimationFrame(f)})(0);
}
</script></body></html>
